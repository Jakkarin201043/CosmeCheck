<body class="antialiased text-on-surface font-body-md text-body-md min-h-screen relative overflow-x-hidden">
<!-- Background Layer with Image & Overlay for Scientific Softness vibe -->
<div class="fixed inset-0 z-0 bg-cover bg-center" data-alt="Soft, blurry pastel gradient background flowing smoothly from mint green to pale lavender and soft peach, creating a calming, premium beauty-tech atmosphere with gentle lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBJLpXZ_6zsX4a6y4uQqsZVmZt_XQ1mFQ07155AvwYoJehJmGYkR7r3XIqBPWSeAbAqeyKkRvLWkjm9xfc51SaNZar3whFGUFI5faWsGBdbDxil1VWtV-dbNbfFs0e9fwMtc2JGS1YDEd1JqdddTtkfm6YgLV63MFjphdfyUJmXIQZhZEPlRvPhM2aSUajGUT167VQaYYdcsPWxLA7Q_vhnp1CcU5EDvgoBm8JsqwcO1Ahs0p9WSahs2mQlbX72fsBhC0igTKUzWDc4');"></div>
<div class="fixed inset-0 z-0 bg-surface/70 backdrop-blur-md"></div>
<!-- Main Content Container -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-center p-container-padding">
<div class="w-full max-w-[400px] flex flex-col gap-stack-lg">
<!-- Brand Header -->
<div class="flex flex-col items-center text-center gap-stack-sm animate-fade-in">
<!-- Soft, floating logo mark -->
<div class="w-20 h-20 rounded-full bg-surface-container-lowest shadow-[0px_10px_30px_rgba(0,0,0,0.04)] flex items-center justify-center mb-2 border border-surface-container-highest">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'wght' 300, 'FILL' 1;">eco</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">CosmeCheck</h1>
</div>
<!-- Login Card (Glassmorphism effect) -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-[24px] p-container-padding shadow-[0px_10px_30px_rgba(0,0,0,0.06)] border border-surface-container-highest/50 flex flex-col gap-stack-md">
<div class="text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your skincare journey.</p>
</div>
<form class="flex flex-col gap-stack-sm">
<!-- Email Input -->
<div class="flex flex-col gap-1">
<label for="email" class="font-label-md text-label-md text-on-surface-variant ml-2">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input id="email" name="email" autocomplete="username" class="w-full bg-surface-container/50 border border-transparent rounded-[16px] py-[16px] pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all duration-300" placeholder="hello@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<label for="password" class="font-label-md text-label-md text-on-surface-variant ml-2">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input id="password" name="password" autocomplete="current-password" class="w-full bg-surface-container/50 border border-transparent rounded-[16px] py-[16px] pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-outline/70 focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all duration-300" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-4 bg-primary-container text-on-surface font-label-md text-label-md py-[16px] px-[32px] rounded-full hover:bg-primary-fixed hover:shadow-md active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-[1px] bg-outline-variant/40 flex-1"></div>
<span class="font-caption text-caption text-on-surface-variant tracking-widest uppercase">Or continue with</span>
<div class="h-[1px] bg-outline-variant/40 flex-1"></div>
</div>
<!-- Social Login Row -->
<div class="flex justify-center gap-gutter">
<!-- Google -->
<button aria-label="Sign in with Google" class="w-[56px] h-[56px] rounded-full bg-surface-container-lowest flex items-center justify-center shadow-[0px_4px_12px_rgba(0,0,0,0.03)] border border-surface-container hover:bg-surface-container-low active:scale-95 transition-all" type="button">
<span aria-hidden="true" class="font-label-md text-label-md font-bold text-on-surface text-[18px]">G</span>
</button>
<!-- Apple -->
<button aria-label="Sign in with Apple" class="w-[56px] h-[56px] rounded-full bg-surface-container-lowest flex items-center justify-center shadow-[0px_4px_12px_rgba(0,0,0,0.03)] border border-surface-container hover:bg-surface-container-low active:scale-95 transition-all" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface text-[24px]" style="font-variation-settings: 'FILL' 1;">ios</span>
</button>
</div>
</div>
<!-- Secondary Link -->
<div class="text-center mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim hover:underline transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
</body></html>
