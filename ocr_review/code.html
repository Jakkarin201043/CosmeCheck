<style>
        /* Hide scrollbar for textarea but keep functionality */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #e4e2e1;
            border-radius: 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar from JSON -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md border-b border-zinc-50 dark:border-zinc-900">
<button class="text-emerald-600 dark:text-emerald-400 hover:opacity-70 transition-opacity active:scale-90 transition-transform flex items-center justify-center w-10 h-10 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50 font-['Plus_Jakarta_Sans']">CosmeCheck</div>
<button class="hover:opacity-70 transition-opacity active:scale-90 transition-transform flex items-center justify-center w-10 h-10 rounded-full overflow-hidden">
<img alt="User avatar" class="w-8 h-8 object-cover rounded-full" data-alt="portrait of a young woman with clear glowing skin on a soft pastel background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9bnrOcACMhCSu6oC0MInUqC5jYhwYVqjI9xAIm-1kibzatC5LVgP_yXpHuOvrGLMm4mAlhWO7-_-RF8SzxOPvBQGs_YZNP9yjTY-tpNiYAmChQu9Kj8F8uIzyHo2ALBIQ8PxcJnJLtlPArvPfE05KzAlLADXDg-AVwpPVMwyMm4sHeq39HjuGFbDmqZuOXDVyogkT7PzmtlGAKUhOK6ha7TGgLp6VmwCgvPYLuAOZQvuFp7ahR-PfRSAcCQq9Xlpc9VuVqbOfCc4o"/>
</button>
</header>
<!-- Main Canvas -->
<main class="max-w-2xl mx-auto px-container-padding py-stack-md flex flex-col gap-stack-md">
<!-- Header Section -->
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Review Ingredients</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We've extracted the text from your image. Please review and edit any typos before we analyze the formula.</p>
</div>
<!-- Warning Card -->
<div class="bg-yellow-50/70 border border-yellow-100 rounded-xl p-4 flex gap-3 items-start shadow-[0px_10px_30px_rgba(0,0,0,0.02)]">
<span class="material-symbols-outlined text-yellow-600 shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-md text-body-md text-yellow-800 leading-snug">Please check the text before analysis. Cameras can sometimes misread small packaging text.</p>
</div>
<!-- Editable Text Area Section -->
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="ingredient-text">Extracted Text</label>
<div class="relative group">
<!-- Subtle backdrop layer for depth -->
<div class="absolute inset-0 bg-white rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.04)] pointer-events-none"></div>
<textarea class="relative w-full h-[280px] bg-surface-container/50 text-on-surface font-body-md text-body-md leading-relaxed rounded-xl p-5 border-none focus:ring-2 focus:ring-primary-container focus:bg-white transition-all resize-none z-10" id="ingredient-text" spellcheck="false">Aqua, Glycerin, Niacinamide, Cetearyl Alcohol, Caprylic/Capric Triglyceride, Dimethicone, Squalane, Ceramide NP, Ceramide AP, Ceramide EOP, Phytosphingosine, Cholesterol, Sodium Hyaluronate, Sodium Lauroyl Lactylate, Carbomer, Xanthan Gum, Phenoxyethanol, Ethylhexylglycerin, Tocopherol, Citric Acid.</textarea>
<!-- Floating Edit Indicator -->
<div class="absolute top-5 right-5 text-on-surface-variant/40 group-focus-within:text-primary transition-colors pointer-events-none z-20">
<span class="material-symbols-outlined" style="font-size: 20px;">edit_document</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-stack-sm mt-stack-sm">
<!-- Primary Action -->
<button class="flex-1 bg-primary-container text-on-primary-fixed-variant font-label-md text-label-md py-4 px-8 rounded-full hover:bg-primary-fixed transition-colors active:scale-95 shadow-[0px_8px_20px_rgba(74,100,90,0.15)] flex justify-center items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">science</span>
                Analyze Ingredients
            </button>
<!-- Secondary Action -->
<button class="flex-1 bg-surface-container text-on-surface font-label-md text-label-md py-4 px-8 rounded-full hover:bg-surface-variant transition-colors active:scale-95 flex justify-center items-center gap-2 border border-transparent hover:border-outline-variant/30">
<span class="material-symbols-outlined">photo_camera</span>
                Retake Photo
            </button>
</div>
</main>
</body></html>
