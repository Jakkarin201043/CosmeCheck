<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CosmeCheck - Skin Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#1b1a26",
                        "primary": "#4a645a",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b1cdc1",
                        "on-tertiary-container": "#676674",
                        "tertiary": "#5e5d6b",
                        "on-tertiary-fixed-variant": "#464553",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f3f0f0",
                        "surface-container": "#f0eded",
                        "surface-bright": "#fcf9f8",
                        "background": "#fcf9f8",
                        "tertiary-container": "#e8e5f6",
                        "secondary-fixed": "#f2dfd7",
                        "on-secondary-container": "#6e605a",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b1cdc1",
                        "surface-container-highest": "#e4e2e1",
                        "outline": "#727975",
                        "secondary-fixed-dim": "#d5c3bb",
                        "tertiary-fixed": "#e3e0f1",
                        "surface-container-high": "#eae7e7",
                        "secondary": "#6a5b55",
                        "error": "#ba1a1a",
                        "surface-dim": "#dcd9d9",
                        "primary-fixed": "#cde9dd",
                        "on-surface-variant": "#424845",
                        "on-primary-container": "#536c63",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#334c43",
                        "outline-variant": "#c2c8c4",
                        "surface-tint": "#4a645a",
                        "on-primary": "#ffffff",
                        "on-surface": "#1b1c1c",
                        "on-error-container": "#93000a",
                        "on-background": "#1b1c1c",
                        "surface-container-low": "#f6f3f2",
                        "primary-container": "#d1ede1",
                        "secondary-container": "#efdcd4",
                        "inverse-surface": "#303030",
                        "tertiary-fixed-dim": "#c7c5d5",
                        "on-secondary-fixed-variant": "#51443e",
                        "surface-variant": "#e4e2e1",
                        "surface": "#fcf9f8",
                        "on-primary-fixed": "#062019",
                        "on-secondary-fixed": "#231915"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "gutter": "16px",
                        "stack-lg": "40px",
                        "stack-sm": "12px",
                        "container-padding": "24px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "caption": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); }
        /* Custom scrollbar for horizontal lists if needed */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-surface pb-32">
<!-- TopAppBar from JSON -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md border-b border-zinc-50 dark:border-zinc-900">
<button class="text-zinc-900 dark:text-zinc-50 hover:opacity-70 transition-opacity active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] text-lg font-semibold text-zinc-900 dark:text-zinc-50 tracking-tight">Skin Profile</h1>
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden hover:opacity-70 transition-opacity active:scale-90 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</div>
</header>
<main class="px-container-padding py-stack-md max-w-2xl mx-auto flex flex-col gap-stack-lg">
<!-- Header Text -->
<section>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Personalize your routine</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Update your details to receive scientifically tailored product recommendations.</p>
</section>
<!-- Skin Type Segmented Picker -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_10px_30px_rgba(0,0,0,0.04)]">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary" data-icon="water_drop">water_drop</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Skin Type</h3>
</div>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
<!-- Active Option -->
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-xl bg-primary-container border border-primary/20 transition-all">
<span class="font-label-md text-label-md text-on-primary-container">Combination</span>
</button>
<!-- Inactive Options -->
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-xl bg-surface-container hover:bg-surface-variant transition-all">
<span class="font-label-md text-label-md text-on-surface-variant">Oily</span>
</button>
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-xl bg-surface-container hover:bg-surface-variant transition-all">
<span class="font-label-md text-label-md text-on-surface-variant">Dry</span>
</button>
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-xl bg-surface-container hover:bg-surface-variant transition-all">
<span class="font-label-md text-label-md text-on-surface-variant">Sensitive</span>
</button>
</div>
</section>
<!-- Skin Concerns Multi-select Chips -->
<section class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_10px_30px_rgba(0,0,0,0.04)]">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary" data-icon="spa">spa</span>
<h3 class="font-headline-md text-headline-md text-on-surface">Primary Concerns</h3>
</div>
<div class="flex flex-wrap gap-3">
<!-- Active Chips -->
<button class="py-2 px-4 rounded-full bg-primary-container border border-primary/20 transition-all flex items-center gap-2">
<span class="font-label-md text-label-md text-on-primary-container">Acne &amp; Blemishes</span>
<span class="material-symbols-outlined text-sm text-on-primary-container" data-icon="check">check</span>
</button>
<button class="py-2 px-4 rounded-full bg-primary-container border border-primary/20 transition-all flex items-center gap-2">
<span class="font-label-md text-label-md text-on-primary-container">Redness</span>
<span class="material-symbols-outlined text-sm text-on-primary-container" data-icon="check">check</span>
</button>
<!-- Inactive Chips -->
<button class="py-2 px-4 rounded-full bg-surface-container hover:bg-surface-variant transition-all text-on-surface-variant">
<span class="font-label-md text-label-md">Aging &amp; Fine Lines</span>
</button>
<button class="py-2 px-4 rounded-full bg-surface-container hover:bg-surface-variant transition-all text-on-surface-variant">
<span class="font-label-md text-label-md">Enlarged Pores</span>
</button>
<button class="py-2 px-4 rounded-full bg-surface-container hover:bg-surface-variant transition-all text-on-surface-variant">
<span class="font-label-md text-label-md">Hyperpigmentation</span>
</button>
<button class="py-2 px-4 rounded-full bg-surface-container hover:bg-surface-variant transition-all text-on-surface-variant">
<span class="font-label-md text-label-md">Uneven Texture</span>
</button>
</div>
</section>
<!-- Input Fields -->
<section class="flex flex-col gap-stack-md">
<!-- Ingredients to Avoid -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-2" for="avoid-ingredients">
<span class="material-symbols-outlined text-primary text-sm" data-icon="science">science</span>
                    Ingredients to Avoid
                </label>
<input class="w-full bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-all" id="avoid-ingredients" placeholder="e.g., Niacinamide, Fragrance" type="text"/>
<p class="font-caption text-caption text-on-surface-variant pl-1">Separate multiple items with commas.</p>
</div>
<!-- Allergy Notes -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-2" for="allergy-notes">
<span class="material-symbols-outlined text-primary text-sm" data-icon="warning">warning</span>
                    Allergy Notes
                </label>
<textarea class="w-full bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 transition-all resize-none" id="allergy-notes" placeholder="List any known dermatological allergies..." rows="3" spellcheck="false"></textarea>
</div>
</section>
<!-- Save Action -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary-container rounded-full py-4 px-8 font-label-md text-label-md flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0px_10px_30px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Save Profile
            </button>
</div>
</main>
<!-- BottomNavBar from JSON -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-xl rounded-t-[32px] border-t border-zinc-100/50 dark:border-zinc-800/50 shadow-[0px_-10px_30px_rgba(0,0,0,0.04)]">
<!-- Inactive: Home -->
<button class="flex flex-col items-center gap-1 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-all p-2 rounded-xl active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-zinc-400 dark:text-zinc-500" data-icon="home">home</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium tracking-wide text-zinc-400 dark:text-zinc-500">Home</span>
</button>
<!-- Inactive: History -->
<button class="flex flex-col items-center gap-1 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-all p-2 rounded-xl active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-zinc-400 dark:text-zinc-500" data-icon="history">history</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium tracking-wide text-zinc-400 dark:text-zinc-500">History</span>
</button>
<!-- Inactive: Scan -->
<button class="flex flex-col items-center gap-1 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-all p-2 rounded-xl active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-zinc-400 dark:text-zinc-500" data-icon="center_focus_strong">center_focus_strong</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium tracking-wide text-zinc-400 dark:text-zinc-500">Scan</span>
</button>
<!-- Active: Profile -->
<button class="flex flex-col items-center gap-1 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-all p-2 rounded-xl active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-emerald-600 dark:text-emerald-400 transition-colors duration-300" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-medium tracking-wide text-emerald-600 dark:text-emerald-400 transition-colors duration-300">Profile</span>
</button>
</nav>
</body></html>
