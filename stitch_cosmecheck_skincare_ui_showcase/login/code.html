</div>
</div>

<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>

<button aria-label="Toggle password visibility" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>

<a class="font-label-sm text-label-sm text-primary hover:text-surface-tint transition-colors" href="#">ลืมรหัสผ่าน?</a>
