<style>
        body { font-family: 'IBM Plex Sans Thai', sans-serif; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .scanner-corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #10a7a7; /* primary-container */
            border-style: solid;
        }
        .scanner-corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
        .scanner-corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
        .scanner-corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
        .scanner-corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #10a7a7, transparent);
            position: absolute;
            top: 50%;
            box-shadow: 0 0 8px #10a7a7;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black text-on-surface h-screen w-full overflow-hidden relative">
<!-- Camera Background Feed Mockup -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A first-person close-up view through a smartphone camera lens, focusing on the back ingredient label of a sleek, minimalist white skincare bottle. The bottle is resting on a clean, light-colored modern bathroom counter. The lighting is bright, natural, and clinical, reflecting a modern wellness aesthetic. The text on the label is slightly blurred as the camera attempts to focus, creating a realistic scanning scenario." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB_d6Rj4UgGI1plW49N7ziVvT5Rm1DR2RutgXLbH_6rSoWN0lgrsl5OZ2vLYna_uSd4p7pW-oo6QrI1-rBWUiBkxAW5n3t5pmJ02dw1tEqpfDEJix49GW7R6H0DVJFAXKUa4nR6Wfc7hdrKIuNAIRb0m9b-zUMBq3cdWKaeU6iZtU1NUqh_EReKHnB7o1yviloBbd6eDi0F7tJOlQ1GDaTNqhiAGExj4Sr0lLybSJ_iyrZ9ZNDs4Juv09lai4gccvG8UuSA_4xJTtQ');">
<!-- Dark overlay to ensure UI legibility -->
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- UI Overlay Layer -->
<div class="absolute inset-0 w-full h-full flex flex-col justify-between pointer-events-none z-10">
<!-- Top Controls -->
<header class="flex justify-between items-center w-full px-margin-mobile pt-12 pb-4 pointer-events-auto">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-black/30 text-white backdrop-blur-md">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-black/30 text-white backdrop-blur-md">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</header>
<!-- Center Scanning Area -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile relative">
<!-- Instruction Pill -->
<div class="mb-6 bg-inverse-surface/80 text-inverse-on-surface px-6 py-2.5 rounded-full font-label-lg text-label-lg backdrop-blur-md shadow-lg pointer-events-auto">
                จัดกรอบฉลากให้อยู่ในกรอบ
            </div>
<!-- Scanner Frame -->
<div class="relative w-full max-w-[320px] aspect-[3/4] rounded-xl border border-white/20 bg-black/10 backdrop-blur-[2px] shadow-[0_0_0_4000px_rgba(0,0,0,0.5)]">
<!-- High-tech corners -->
<div class="scanner-corner scanner-corner-tl"></div>
<div class="scanner-corner scanner-corner-tr"></div>
<div class="scanner-corner scanner-corner-bl"></div>
<div class="scanner-corner scanner-corner-br"></div>
<!-- Scanning Laser Line -->
<div class="scan-line"></div>
<!-- Floating Raw OCR Text (Simulated active read) -->
<div class="absolute inset-0 p-4 flex flex-col justify-center gap-2 opacity-60">
<div class="h-4 w-3/4 bg-white/40 rounded blur-[1px]"></div>
<div class="h-4 w-full bg-white/40 rounded blur-[1px]"></div>
<div class="h-4 w-5/6 bg-white/40 rounded blur-[1px]"></div>
<div class="h-4 w-2/3 bg-white/40 rounded blur-[1px]"></div>
</div>
</div>
<!-- Live OCR Results Card -->
<div class="absolute bottom-8 w-full max-w-[340px] px-4 pointer-events-auto">
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_8px_24px_rgba(16,167,167,0.15)] flex flex-col gap-xs">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[18px] animate-spin" data-icon="progress_activity">progress_activity</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">กำลังอ่านข้อความ (OCR)...</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface line-clamp-3 opacity-80 leading-relaxed">
                        Water, Glycerin, Niacinamide, Alcohol Denat., Butylene Glycol, Propanediol, 1,2-Hexanediol, Carbomer, Panthenol, Allantoin, Sodium Hyaluronate, Fragrance, Ethylhexylglycerin, Disodium EDTA
                    </p>
</div>
</div>
</main>
<!-- Bottom Controls -->
<footer class="w-full pb-10 pt-4 px-margin-mobile flex justify-around items-center bg-gradient-to-t from-black/80 to-transparent pointer-events-auto">
<!-- Gallery Button -->
<button class="w-12 h-12 flex flex-col items-center justify-center text-white gap-1">
<span class="material-symbols-outlined text-[28px]" data-icon="photo_library">photo_library</span>
</button>
<!-- Shutter Button -->
<button class="relative w-[72px] h-[72px] rounded-full border-4 border-white flex items-center justify-center">
<div class="w-[56px] h-[56px] bg-white rounded-full active:scale-90 transition-transform"></div>
</button>
<!-- Help Button -->
<button class="w-12 h-12 flex flex-col items-center justify-center text-white gap-1">
<span class="material-symbols-outlined text-[28px]" data-icon="help_outline">help_outline</span>
</button>
</footer>
</div>
</body></html>
